[workspace]
members = [
  "apps/hub-api",
  "apps/release-worker",
  "apps/status-worker",
  "apps/dns-worker",
  "apps/failover-worker",
  "apps/node-agent",
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/protocol",
  "crates/config-compiler",
  "crates/dns-provider",
  "crates/ops-orchestrator",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
redis = { version = "0.29", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
