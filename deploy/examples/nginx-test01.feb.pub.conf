server {
    listen 80;
    listen [::]:80;
    server_name test01.feb.pub;

    access_log /var/log/nginx/test01.feb.pub.access.log;
    error_log /var/log/nginx/test01.feb.pub.error.log;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test01.feb.pub;

    ssl_certificate /etc/letsencrypt/live/test01.feb.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test01.feb.pub/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/test01.feb.pub/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PingoraHubTLS:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/test01.feb.pub.access.log;
    error_log /var/log/nginx/test01.feb.pub.error.log;

    location / {
        proxy_pass http://10.20.3.53:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
